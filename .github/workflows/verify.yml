name: Security & Syntax Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run secret grep gate
        run: npm run grep-gate

      - name: Run proxy & bot unit tests
        run: npm run test:proxy
